services:
  media-vault:
    image: ${MEDIA_VAULT_IMAGE:-ghcr.io/cazvisuals/caz-media-vault:edge}
    pull_policy: always
    container_name: constants-hub
    # Synology shared-folder ACLs commonly block the image's unprivileged UID.
    # Organizer writes are constrained in application code to files in Inbox.
    user: "0:0"
    restart: unless-stopped
    environment:
      MEDIA_ROOT: /media
      MEDIA_INBOX: /media/Inbox
      APP_DATA_ROOT: /data
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      CONVERSION_SCHEDULE_ENABLED: ${CONVERSION_SCHEDULE_ENABLED:-true}
      CONVERSION_START_HOUR: ${CONVERSION_START_HOUR:-0}
      CONVERSION_END_HOUR: ${CONVERSION_END_HOUR:-7}
      MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-true}
      MAINTENANCE_HOUR: ${MAINTENANCE_HOUR:-4}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      TRANSCODE_ACCEL: ${TRANSCODE_ACCEL:-none}
      TRANSCODE_THREADS: ${TRANSCODE_THREADS:-}
      TRANSCODE_THREADS_NIGHT: ${TRANSCODE_THREADS_NIGHT:-2}
      TRANSCODE_THREADS_DAY: ${TRANSCODE_THREADS_DAY:-1}
      TRANSCODE_PRESET: ${TRANSCODE_PRESET:-superfast}
      TRANSCODE_CRF: ${TRANSCODE_CRF:-21}
      VAAPI_DEVICE: ${VAAPI_DEVICE:-/dev/dri/renderD128}
    ports:
      - "3000:3000"
    volumes:
      - "${MEDIA_HOST_PATH:-/volume1/video}:/media:rw"
      - "${APP_DATA_HOST_PATH:-./data}:/data:rw"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: constants-hub-tunnel
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel --no-autoupdate run
    depends_on:
      media-vault:
        condition: service_healthy
